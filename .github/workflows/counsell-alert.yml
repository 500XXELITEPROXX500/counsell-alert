name: Counsell Alert

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification to the phone"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: counsell-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Counsell Alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python src/monitor.py

      - name: Save alert state
        run: |
          if git diff --quiet -- src/state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "counsell-alert[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/state.json
          git commit -m "Update Counsell alert state"
          git push
